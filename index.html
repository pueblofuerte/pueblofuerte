<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — Iglesia Pueblo Fuerte</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="vistaLogin" class="login-box">
  <img src="logopf.png" alt="Logo Iglesia Pueblo Fuerte" class="logo-login">
  <p class="help-text">Panel administrativo</p>
  <label for="inputClave">Clave de administrador</label>
  <input type="password" id="inputClave">
  <button class="btn primary" onclick="iniciarSesion()" style="width:100%">Entrar</button>
  <p id="msgLogin" class="msg"></p>
</div>

<!-- PANEL -->
<div id="vistaPanel" style="display:none">
  <header class="topbar">
    <div class="topbar-logo">
      <img src="logopf.png" alt="Logo Iglesia Pueblo Fuerte" class="logo-header">
    </div>
    <button class="btn" onclick="cerrarSesion()">Cerrar sesión</button>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="anuncios" onclick="cambiarTab('anuncios')">Anuncios</button>
      <button class="tab-btn" data-tab="eventos" onclick="cambiarTab('eventos')">Eventos</button>
      <button class="tab-btn" data-tab="peticiones" onclick="cambiarTab('peticiones')">Peticiones</button>
    </div>

    <!-- ═══════════ ANUNCIOS ═══════════ -->
    <div id="tab-anuncios" class="tab-panel active">

      <div class="card">
        <h3 id="tituloFormAnuncio">Nuevo anuncio</h3>
        <input type="hidden" id="anuncioId">

        <label>Tipo</label>
        <select id="anuncioTipo" onchange="actualizarModoAnuncio()">
          <option value="general" selected>Anuncio general</option>
          <option value="predicador">Predicador de la semana</option>
        </select>

        <label>Título</label>
        <input type="text" id="anuncioTitulo">

        <!-- Anuncio general: texto libre -->
        <div id="contenidoGeneralWrap">
          <label>Contenido</label>
          <textarea id="anuncioContenido"></textarea>
        </div>

        <!-- Predicador de la semana: se arma solo, día por día -->
        <div id="contenidoPredicadorWrap" style="display:none">
          <label>Nombre</label>
          <input type="text" id="predicadorNombreInput" placeholder="Escribe un nombre y presiona Enter">
          <div id="predicadorLista" class="dias-lista"></div>
          <button type="button" class="btn small" id="btnDeshacerDia" onclick="deshacerUltimoDia()" style="display:none">Deshacer último</button>
        </div>

        <div class="switch-row" id="filaFlotante">
          <input type="checkbox" id="anuncioFlotante">
          <label style="margin:0">Flotante</label>
        </div>
        <div class="switch-row">
          <input type="checkbox" id="anuncioActivo" checked>
          <label style="margin:0">Activo</label>
        </div>

        <div class="row">
          <button class="btn primary" onclick="guardarAnuncio()">Guardar</button>
          <button class="btn" onclick="limpiarFormAnuncio()">Cancelar</button>
        </div>
        <p id="msgAnuncio" class="msg"></p>
      </div>

      <div class="card">
        <h3>Anuncios publicados</h3>
        <div id="listaAnuncios"><p class="empty-text">Cargando…</p></div>
      </div>
    </div>

    <!-- ═══════════ EVENTOS ═══════════ -->
    <div id="tab-eventos" class="tab-panel">

      <div class="card">
        <h3>Nuevo evento</h3>
        <label>Etiqueta</label>
        <input type="text" id="eventoEtiqueta">

        <label>Imagen / flyer</label>
        <input type="file" id="eventoImagen" accept="image/*">

        <div class="switch-row">
          <input type="checkbox" id="eventoActivo" checked>
          <label style="margin:0">Activo</label>
        </div>

        <button class="btn primary" onclick="guardarEvento()">Guardar</button>
        <p id="msgEvento" class="msg"></p>
      </div>

      <div class="card">
        <h3>Eventos publicados</h3>
        <div id="listaEventos"><p class="empty-text">Cargando…</p></div>
      </div>
    </div>

    <!-- ═══════════ PETICIONES ═══════════ -->
    <div id="tab-peticiones" class="tab-panel">
      <div class="card">
        <h3>Peticiones de oración recibidas</h3>
        <div id="listaPeticiones"><p class="empty-text">Cargando…</p></div>
      </div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
