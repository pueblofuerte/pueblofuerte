<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — Iglesia Pueblo Fuerte</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="vistaLogin" class="login-box">
  <span class="logo-halo logo-halo-login"><img src="logopf.png" alt="Logo Iglesia Pueblo Fuerte" class="logo-login"></span>
  <p class="help-text">Panel administrativo</p>
  <label for="inputClave">Clave de administrador</label>
  <input type="password" id="inputClave">
  <button class="btn primary" onclick="iniciarSesion()" style="width:100%">Entrar</button>
  <p id="msgLogin" class="msg"></p>
</div>

<!-- PANEL -->
<div id="vistaPanel" style="display:none">
  <header class="topbar">
    <div class="topbar-logo">
      <span class="topbar-brand">Pueblo Fuerte</span>
      <span class="logo-halo"><img src="logopf.png" alt="Logo Iglesia Pueblo Fuerte" class="logo-header"></span>
    </div>
    <button class="btn" onclick="cerrarSesion()">Cerrar sesión</button>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="anuncios" onclick="cambiarTab('anuncios')">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4,10 V14 H7 L14,18 V6 L7,10 Z"/><path d="M17,9 C18.5,10.2 18.5,13.8 17,15"/><path d="M8,15 L9.3,19.2 A1.2,1.2 0 0 1 8.1,20.5 H8 A1.2,1.2 0 0 1 6.85,19.5 L6,15.5"/></svg>
        Anuncios
      </button>
      <button class="tab-btn" data-tab="eventos" onclick="cambiarTab('eventos')">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5,5.5 H19 A1,1 0 0 1 20,6.5 V19 A1,1 0 0 1 19,20 H5 A1,1 0 0 1 4,19 V6.5 A1,1 0 0 1 5,5.5 Z"/><path d="M4,9.5 H20"/><path d="M8,3.5 V7"/><path d="M16,3.5 V7"/><path fill="currentColor" stroke="none" d="M11,12.3 h2 v2 h-2 z"/></svg>
        Eventos
      </button>
      <button class="tab-btn" data-tab="peticiones" onclick="cambiarTab('peticiones')">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5,4 H19 V20 H5 Z"/><path d="M8,9 H16"/><path d="M8,12 H16"/><path d="M8,15 H14"/></svg>
        Peticiones
      </button>
    </div>

    <!-- ═══════════ ANUNCIOS ═══════════ -->
    <div id="tab-anuncios" class="tab-panel active">

      <div class="card">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4,10 V14 H7 L14,18 V6 L7,10 Z"/><path d="M17,9 C18.5,10.2 18.5,13.8 17,15"/><path d="M8,15 L9.3,19.2 A1.2,1.2 0 0 1 8.1,20.5 H8 A1.2,1.2 0 0 1 6.85,19.5 L6,15.5"/></svg>
          </span>
          <h3 id="tituloFormAnuncio">Nuevo anuncio</h3>
        </div>
        <input type="hidden" id="anuncioId">

        <label>Tipo</label>
        <select id="anuncioTipo" onchange="actualizarModoAnuncio()">
          <option value="general" selected>Anuncio general</option>
          <option value="predicador">Predicador de la semana</option>
        </select>

        <label>Título</label>
        <input type="text" id="anuncioTitulo">

        <!-- Anuncio general: texto libre -->
        <div id="contenidoGeneralWrap">
          <label>Contenido</label>
          <textarea id="anuncioContenido"></textarea>
        </div>

        <!-- Predicador de la semana: se arma solo, día por día -->
        <div id="contenidoPredicadorWrap" style="display:none">
          <label>Nombre</label>
          <input type="text" id="predicadorNombreInput" placeholder="Escribe un nombre y presiona Enter">
          <div id="predicadorLista" class="dias-lista"></div>
          <button type="button" class="btn small" id="btnDeshacerDia" onclick="deshacerUltimoDia()" style="display:none">Deshacer último</button>
        </div>

        <div class="switch-row" id="filaFlotante">
          <input type="checkbox" id="anuncioFlotante">
          <label style="margin:0">Flotante</label>
        </div>
        <div class="switch-row">
          <input type="checkbox" id="anuncioActivo" checked>
          <label style="margin:0">Activo</label>
        </div>

        <div class="row">
          <button class="btn primary" onclick="guardarAnuncio()">Guardar</button>
          <button class="btn" onclick="limpiarFormAnuncio()">Cancelar</button>
        </div>
        <p id="msgAnuncio" class="msg"></p>
      </div>

      <div class="card">
        <h3>Anuncios publicados</h3>
        <div id="listaAnuncios" class="lista-hundida"><p class="empty-text">Cargando…</p></div>
      </div>
    </div>

    <!-- ═══════════ EVENTOS ═══════════ -->
    <div id="tab-eventos" class="tab-panel">

      <div class="card">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5,5.5 H19 A1,1 0 0 1 20,6.5 V19 A1,1 0 0 1 19,20 H5 A1,1 0 0 1 4,19 V6.5 A1,1 0 0 1 5,5.5 Z"/><path d="M4,9.5 H20"/><path d="M8,3.5 V7"/><path d="M16,3.5 V7"/><path fill="currentColor" stroke="none" d="M11,12.3 h2 v2 h-2 z"/></svg>
          </span>
          <h3>Nuevo evento</h3>
        </div>
        <label>Etiqueta</label>
        <input type="text" id="eventoEtiqueta">

        <label>Imagen / flyer</label>
        <input type="file" id="eventoImagen" accept="image/*" onchange="previsualizarFlyer(this)">
        <img id="previewFlyer" class="flyer-preview" style="display:none">

        <div class="switch-row">
          <input type="checkbox" id="eventoActivo" checked>
          <label style="margin:0">Activo</label>
        </div>

        <button class="btn primary" onclick="guardarEvento()">Guardar</button>
        <p id="msgEvento" class="msg"></p>
      </div>

      <div class="card">
        <h3>Eventos publicados</h3>
        <div id="listaEventos" class="lista-hundida"><p class="empty-text">Cargando…</p></div>
      </div>
    </div>

    <!-- ═══════════ PETICIONES ═══════════ -->
    <div id="tab-peticiones" class="tab-panel">
      <div class="card">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5,4 H19 V20 H5 Z"/><path d="M8,9 H16"/><path d="M8,12 H16"/><path d="M8,15 H14"/></svg>
          </span>
          <h3>Peticiones de oración recibidas</h3>
        </div>
        <div id="listaPeticiones" class="lista-hundida"><p class="empty-text">Cargando…</p></div>
      </div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
